[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwork-nautilus"
version = "0.2.0"
description = "Native Nautilus options actors, intraday strategy, replay and dockable Dash terminal"
requires-python = ">=3.12,<3.15"
dependencies = [
  "nautilus_trader==2.0.0rc5", "thetadata>=1.0.9,<2",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2", "tzdata>=2025.1",
  "numpy>=2.1,<3", "pandas>=2.2,<3", "pyarrow>=19,<24",
  "QuantLib>=1.42,<2", "dash>=4.1,<5", "plotly>=6,<7",
  "dash-ag-grid>=35,<36", "flexlayout-dash==2.0.0",
  "pywebview>=6,<7", "waitress>=3,<4",
  "psutil>=7,<8",
  "scipy>=1.16,<2", "exchange-calendars>=4.11,<5", "ibapi>=9.81,<10",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "playwright>=1.55,<2"]

[project.scripts]
qwork = "qwork.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qwork*"]

[tool.setuptools.package-data]
"qwork.ui" = ["assets/*.css"]
"qwork.ui.terminal" = ["assets/*.css", "assets/*.js", "*.md"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
